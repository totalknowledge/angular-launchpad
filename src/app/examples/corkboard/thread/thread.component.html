<div class="thread-viewer">
  <header class="thread-header">
    <div class="breadcrumb">
      <a routerLink="/examples/corkboard">Corkboard</a> &gt; <span>{{ thread?.title || 'Untitled thread' }}</span>
    </div>
    <button mat-raised-button color="primary" routerLink="/examples/corkboard">
      Back to Corkboard
    </button>
  </header>

  @if (posts$ | async; as posts) {
    <div class="posts-list">
      @for (post of posts; track post.id || $index; let i = $index) {
        <app-post 
          [post]="post" 
          [index]="!threadId ? i : (isOriginPost(post) ? 0 : 1)" 
          (deleted)="onDelete()">
        </app-post>
      }
    </div>

    <div class="reply-section">
      <h3>Post a Reply</h3>
      <app-post 
        [post]="newpost" 
        [index]="posts.length + 1" 
        (created)="onCreate()" 
        (canceled)="onCancel()">
      </app-post>
    </div>
  }
</div>
